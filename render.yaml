services:
  - type: web
    name: arch-circare-api
    env: python
    rootDir: navigator
    branch: MVP
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: standard
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: data
      - key: MODEL_NAME
        value: vit_base_patch14_dinov2
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: ALLOW_PDF
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: UPLOAD_TMP_DIR
        value: /tmp
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DISABLE_MODEL_WARMUP
        value: "true"
      - key: DISABLE_INDEX_WARMUP
        value: "true"
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: R2_PUBLIC_URL
        sync: false  # Set manually after R2 bucket creation

  - type: web
    name: arch-circare-ui
    env: static
    rootDir: frontend
    branch: MVP
    autoDeploy: true
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://arch-circare-api-bfle.onrender.com
      # PostHog Analytics - set these manually in Render dashboard
      # Get Project API Key from: PostHog Dashboard → Project Settings → Project API Key
      # - key: VITE_POSTHOG_KEY
      #   sync: false  # Set manually: phc_your_project_api_key_here
      # - key: VITE_POSTHOG_HOST
      #   sync: false  # Optional: https://us.i.posthog.com (default) or https://eu.i.posthog.com